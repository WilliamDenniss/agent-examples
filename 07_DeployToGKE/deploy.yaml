apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-agent
  namespace: trading
  labels:
    app: trading-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-agent
  template:
    metadata:
      labels:
        app: trading-agent
    spec:
      # Workload Identity: this KSA must be bound to a GSA with roles/aiplatform.user
      # so the agentengine:// Sessions + Memory services can authenticate.
      serviceAccountName: trading-agent
      containers:
        - name: trading-agent
          image: docker.io/wdenniss/trading-agent:1
          ports:
            - containerPort: 8080
          # Non-secret config.
          env:
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "TRUE"
          # These env vars come from a Secret (created by deploy.sh):
          # APCA_API_KEY_ID, APCA_API_SECRET_KEY, SESSION_SERVICE_URI, MEMORY_SERVICE_URI.
          envFrom:
            - secretRef:
                name: trading-agent-secrets
          resources:
            requests:
              cpu: ".5"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /list-apps
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20

