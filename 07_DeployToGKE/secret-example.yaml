# Example Secret for the trading agent. Copy this to secret.yaml, fill in real
# values, and apply it (deploy.sh creates the same Secret from env vars instead).
# stringData lets you write plaintext; Kubernetes base64-encodes it on apply.
apiVersion: v1
kind: Secret
metadata:
  name: trading-agent-secrets
  namespace: trading
type: Opaque
stringData:
  APCA_API_KEY_ID: "your-key-id"
  APCA_API_SECRET_KEY: "your-secret-key"
  SESSION_SERVICE_URI: "agentengine://projects/555OOO555/locations/us-west1/reasoningEngines/5272175847371964416"
  MEMORY_SERVICE_URI: "agentengine://projects/555OOO555/locations/us-west1/reasoningEngines/5272175847371964416"
